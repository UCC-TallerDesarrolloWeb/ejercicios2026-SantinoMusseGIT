<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Íconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- CSS propio: superpone el avatar sobre la portada -->
    <style>
        .profile {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            object-fit: cover;
            object-position: center 70%; /* enfoca el auto dentro del círculo */
            background: #fff;
            border: 3px solid #fff;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center my-5">

        <div class="card" style="width: 18rem;">

            <!-- Portada + avatar superpuesto -->
            <div class="position-relative">
                <img src="https://picsum.photos/seed/ciudad/600/300"
                     class="card-img-top" alt="Portada">
                <img src="imagenes/auto.png"
                     class="profile rounded-circle" alt="Foto de Santino">
            </div>

            <div class="card-body text-center pt-5">
                <h5 class="card-title">Santino Mussetti</h5>
                <p class="card-text small">
                    Car Lover 🏎️ | Apasionado por los autos y el desarrollo web.
                </p>
                <a href="#" class="btn btn-primary btn-sm">Ver perfil</a>
            </div>

            <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2 text-secondary small">
                    <i class="bi bi-chat-left-text"></i> Ir a mensajes
                </a>
                <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2 text-secondary small">
                    <i class="bi bi-bell"></i> Notificaciones
                    <span class="badge bg-danger">+99</span>
                </a>
                <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2 bg-light small">
                    <i class="bi bi-people-fill"></i> Solicitudes Pendientes
                </a>
                <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2 text-secondary small">
                    <i class="bi bi-camera-video"></i> Llamar
                </a>
            </div>

        </div>
    </div>

</body>
</html>
