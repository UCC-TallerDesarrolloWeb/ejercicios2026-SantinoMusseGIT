<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <div class="border">

            <!-- Meses: 2 columnas de 6 -->
            <div class="row bg-black text-white text-center fw-bold py-1">
                <div class="col-6">Enero</div>
                <div class="col-6">Febrero</div>
            </div>

            <!-- Semanas: 8 columnas iguales -->
            <div class="row bg-black text-white text-center">
                <div class="col border border-light">Semana 1</div>
                <div class="col border border-light">Semana 2</div>
                <div class="col border border-light">Semana 3</div>
                <div class="col border border-light">Semana 4</div>
                <div class="col border border-light">Semana 1</div>
                <div class="col border border-light">Semana 2</div>
                <div class="col border border-light">Semana 3</div>
                <div class="col border border-light">Semana 4</div>
            </div>

            <div class="py-3">

                <!-- Tarea 1: empieza al inicio, ocupa 5 columnas -->
                <div class="row py-2">
                    <div class="col-5">
                        <div class="bg-secondary text-white rounded p-2 d-flex justify-content-between">
                            <div>
                                <div class="text-info">Completed</div>
                                <div class="fw-bold fs-6">Define Arqchitecture</div>
                                <div class="opacity-50">20 Enero</div>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <img src="https://i.pravatar.cc/40?img=5" alt="Usuario 1" class="rounded-circle" width="24" height="24">
                                <img src="https://i.pravatar.cc/40?img=9" alt="Usuario 2" class="rounded-circle" width="24" height="24">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tarea 2: 3 columnas vacías y después 5 -->
                <div class="row py-2">
                    <div class="col-3"></div>
                    <div class="col-5">
                        <div class="bg-secondary text-white rounded p-2 d-flex justify-content-between">
                            <div>
                                <div class="text-warning">In Progress</div>
                                <div class="fw-bold fs-6">Define Arqchitecture</div>
                                <div class="opacity-50">20 Enero</div>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <img src="https://i.pravatar.cc/40?img=5" alt="Usuario 1" class="rounded-circle" width="24" height="24">
                                <img src="https://i.pravatar.cc/40?img=9" alt="Usuario 2" class="rounded-circle" width="24" height="24">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tarea 3: 5 columnas vacías y después 5 -->
                <div class="row py-2">
                    <div class="col-5"></div>
                    <div class="col-5">
                        <div class="bg-secondary text-white rounded p-2 d-flex justify-content-between">
                            <div>
                                <div class="text-danger">Blocked</div>
                                <div class="fw-bold fs-6">Define Arqchitecture</div>
                                <div class="opacity-50">20 Enero</div>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <img src="https://i.pravatar.cc/40?img=5" alt="Usuario 1" class="rounded-circle" width="24" height="24">
                                <img src="https://i.pravatar.cc/40?img=9" alt="Usuario 2" class="rounded-circle" width="24" height="24">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
