<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube - Bootstrap</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f4f4;
        }

        .video-card {
            width: 100%;
            max-width: 380px;
            transition: transform 0.2s ease;
        }

        .video-card:hover {
            transform: scale(1.03);
        }

        .video-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .channel-avatar {
            width: 38px;
            height: 38px;
            object-fit: cover;
        }

        .action-buttons {
            max-height: 0;
            opacity: 0;
            transition: max-height 0.2s ease, opacity 0.2s ease;
        }

        .video-card:hover .action-buttons,
        .video-card:focus-within .action-buttons {
            max-height: 100px;
            opacity: 1;
        }

        .video-card a:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
    </style>
</head>

<body>

    <main class="container my-5">

        <h1 class="text-center mb-4">
            Videos recomendados
        </h1>

        <div class="row g-3 justify-content-center">

            <!-- Video 1 -->
            <div class="col-12 col-md-6 col-lg-4">

                <article class="card video-card text-bg-dark border-0 overflow-hidden shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1561731216-c3a4d99437d5?w=900"
                        class="card-img-top video-image"
                        alt="Tigre descansando"
                    >

                    <div class="card-body">

                        <a
                            href="https://www.youtube.com/results?search_query=tigres+documental"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="card-title text-white text-decoration-none fw-bold fs-6"
                        >
                            Los tigres más increíbles del mundo
                        </a>

                        <div class="row align-items-start mt-3">

                            <div class="col-2">
                                <img
                                    src="https://i.pravatar.cc/100?img=12"
                                    class="rounded-circle channel-avatar"
                                    alt="Avatar del canal"
                                >
                            </div>

                            <div class="col-10">

                                <p class="text-light small mb-1">
                                    Mundo Animal
                                </p>

                                <p class="text-light opacity-50 small mb-0">
                                    23 mil vistas · Hace 1 día
                                </p>

                            </div>

                        </div>

                        <div class="action-buttons overflow-hidden mt-3">

                            <div class="row g-1">

                                <div class="col-6">
                                    <button
                                        type="button"
                                        class="btn btn-outline-light btn-sm w-100"
                                        onclick="alert('Agregado a Ver más tarde')"
                                    >
                                        Ver más tarde
                                    </button>
                                </div>

                                <div class="col-6">
                                    <button
                                        type="button"
                                        class="btn btn-outline-light btn-sm w-100"
                                        onclick="alert('Agregado a la fila')"
                                    >
                                        Agregar a la fila
                                    </button>
                                </div>

                            </div>

                        </div>

                    </div>

                </article>

            </div>

            <!-- Video 2 -->
            <div class="col-12 col-md-6 col-lg-4">

                <article class="card video-card text-bg-dark border-0 overflow-hidden shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?w=900"
                        class="card-img-top video-image"
                        alt="Paisaje de naturaleza"
                    >

                    <div class="card-body">

                        <a
                            href="https://www.youtube.com/results?search_query=naturaleza+documental"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="card-title text-white text-decoration-none fw-bold fs-6"
                        >
                            Las maravillas de la naturaleza
                        </a>

                        <div class="row align-items-start mt-3">

                            <div class="col-2">
                                <img
                                    src="https://i.pravatar.cc/100?img=32"
                                    class="rounded-circle channel-avatar"
                                    alt="Avatar del canal"
                                >
                            </div>

                            <div class="col-10">

                                <p class="text-light small mb-1">
                                    Explorando el Mundo
                                </p>

                                <p class="text-light opacity-50 small mb-0">
                                    120 mil vistas · Hace 3 días
                                </p>

                            </div>

                        </div>

                        <div class="action-buttons overflow-hidden mt-3">

                            <div class="row g-1">

                                <div class="col-6">
                                    <button
                                        type="button"
                                        class="btn btn-outline-light btn-sm w-100"
                                        onclick="alert('Agregado a Ver más tarde')"
                                    >
                                        Ver más tarde
                                    </button>
                                </div>

                                <div class="col-6">
                                    <button
                                        type="button"
                                        class="btn btn-outline-light btn-sm w-100"
                                        onclick="alert('Agregado a la fila')"
                                    >
                                        Agregar a la fila
                                    </button>
                                </div>

                            </div>

                        </div>

                    </div>

                </article>

            </div>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
