<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de vuelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <main class="container py-4">

        <button class="btn btn-primary btn-sm dropdown-toggle mb-2" type="button"
                data-bs-toggle="collapse" data-bs-target="#calendario">
            Selecciona la fecha
        </button>

        <div class="collapse show" id="calendario">
            <div class="card">
                <div class="card-body">

                    <h1 class="h5 text-center my-3">Fechas de Vuelos</h1>

                    <div class="row">

                        <!-- Septiembre -->
                        <div class="col-12 col-md-6 border-end">
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <button type="button" class="btn btn-outline-secondary btn-sm">&lt;</button>
                                <strong class="small">Septiembre 2025</strong>
                            </div>
                            <table class="table table-borderless table-sm text-center mb-0">
                                <thead>
                                    <tr><th>Lun</th><th>Mar</th><th>Mie</th><th>Jue</th><th>Vie</th><th>Sab</th><th>Dom</th></tr>
                                </thead>
                                <tbody class="text-secondary">
                                    <tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr>
                                    <tr><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td></tr>
                                    <tr><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td></tr>
                                    <tr><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td></tr>
                                    <tr><td>29</td><td>30</td><td class="text-body-tertiary">1</td><td class="text-body-tertiary">2</td><td class="text-body-tertiary">3</td><td class="text-body-tertiary">4</td><td class="text-body-tertiary">5</td></tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Octubre -->
                        <div class="col-12 col-md-6">
                            <div class="d-flex align-items-center justify-content-end gap-2 mb-3">
                                <strong class="small">Octubre 2025</strong>
                                <button type="button" class="btn btn-outline-secondary btn-sm">&gt;</button>
                            </div>
                            <table class="table table-borderless table-sm text-center mb-0">
                                <thead>
                                    <tr><th>Lun</th><th>Mar</th><th>Mie</th><th>Jue</th><th>Vie</th><th>Sab</th><th>Dom</th></tr>
                                </thead>
                                <tbody class="text-secondary">
                                    <tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr>
                                    <tr><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td></tr>
                                    <tr><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td></tr>
                                    <tr><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td></tr>
                                    <tr><td>29</td><td>30</td><td class="text-body-tertiary">1</td><td class="text-body-tertiary">2</td><td class="text-body-tertiary">3</td><td class="text-body-tertiary">4</td><td class="text-body-tertiary">5</td></tr>
                                </tbody>
                            </table>
                        </div>

                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                data-bs-toggle="collapse" data-bs-target="#calendario">Cancelar</button>
                        <button type="button" class="btn btn-outline-primary btn-sm">Guardar</button>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <!-- JS de Bootstrap: hace que el botón muestre/oculte el calendario -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
