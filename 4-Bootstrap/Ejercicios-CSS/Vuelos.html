<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de vuelos</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 800px;">

            <div class="card-header bg-primary text-white">
                <h1 class="h4 mb-0">Seleccioná tu vuelo</h1>
            </div>

            <div class="card-body">
                <form>
                    <div class="row g-3">

                        <div class="col-12 col-md-6">
                            <label for="origen" class="form-label">Desde</label>
                            <select id="origen" class="form-select">
                                <option selected>Elegir origen</option>
                                <option>Córdoba</option>
                                <option>Buenos Aires</option>
                                <option>Mendoza</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="destino" class="form-label">Hasta</label>
                            <select id="destino" class="form-select">
                                <option selected>Elegir destino</option>
                                <option>Buenos Aires</option>
                                <option>Bariloche</option>
                                <option>Salta</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="ida" class="form-label">Fecha de ida</label>
                            <input type="date" id="ida" class="form-control">
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="vuelta" class="form-label">Fecha de vuelta</label>
                            <input type="date" id="vuelta" class="form-control">
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="pasajeros" class="form-label">Pasajeros</label>
                            <select id="pasajeros" class="form-select">
                                <option>1 pasajero</option>
                                <option>2 pasajeros</option>
                                <option>3 pasajeros</option>
                                <option>4 pasajeros</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6 d-flex align-items-end">
                            <button type="button" class="btn btn-primary w-100">
                                Buscar vuelos
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
