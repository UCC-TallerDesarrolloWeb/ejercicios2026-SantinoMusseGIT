<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda</title>

    <link rel="stylesheet" href="miEstilo.css">
</head>

<body>

    <header>

        <h1>Tienda</h1>

        <a href="carrito.html">
            Ver carrito (<span id="contadorCarrito">0</span>)
        </a>

    </header>

    <main>

        <h2>Filtros</h2>

        <div class="filtros">

            <label for="busqueda">
                Buscar:
            </label>

            <input
                type="text"
                id="busqueda"
                placeholder="Buscar producto"
            >

            <br><br>

            <label for="precioMin">
                Precio mínimo:
            </label>

            <input
                type="number"
                id="precioMin"
                placeholder="Precio mínimo"
            >

            <label for="precioMax">
                Precio máximo:
            </label>

            <input
                type="number"
                id="precioMax"
                placeholder="Precio máximo"
            >

            <br><br>

            <label for="marca">
                Marca:
            </label>

            <select id="marca">

                <option value="">
                    Todas
                </option>

                <option value="Gran Marc">
                    Gran Marc
                </option>

                <option value="Daedo">
                    Daedo
                </option>

            </select>

            <br><br>

            <p>Categorías:</p>

            <label>

                <input
                    type="checkbox"
                    class="categoria"
                    value="Protectores"
                >

                Protectores

            </label>

            <label>

                <input
                    type="checkbox"
                    class="categoria"
                    value="Dobok"
                >

                Dobok

            </label>

            <label>

                <input
                    type="checkbox"
                    class="categoria"
                    value="Entrenamiento"
                >

                Entrenamiento

            </label>

            <br><br>

            <label for="orden">
                Ordenar por:
            </label>

            <select id="orden">

                <option value="">
                    Sin ordenar
                </option>

                <option value="precioAsc">
                    Precio: menor a mayor
                </option>

                <option value="precioDesc">
                    Precio: mayor a menor
                </option>

                <option value="nombreAsc">
                    Nombre: A-Z
                </option>

                <option value="nombreDesc">
                    Nombre: Z-A
                </option>

            </select>

        </div>


        <h2>Productos</h2>

        <div id="productos"></div>

    </main>


    <script src="tienda.js"></script>

</body>

</html>
