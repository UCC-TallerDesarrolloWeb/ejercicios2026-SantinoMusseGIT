<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda</title>

    <link rel="stylesheet" href="miEstilo.css">
</head>

<body>

    <header>
        <h1>Tienda</h1>

        <a href="carrito.html">Ver carrito</a>
    </header>

    <main>

        <h2>Filtros</h2>

        <div class="filtros">

            <label for="busqueda">Buscar:</label>
            <input
                type="text"
                id="busqueda"
                placeholder="Buscar producto"
            >

            <br><br>

            <label for="precioMin">Precio mínimo:</label>
            <input
                type="number"
                id="precioMin"
                placeholder="Precio mínimo"
            >

            <label for="precioMax">Precio máximo:</label>
            <input
                type="number"
                id="precioMax"
                placeholder="Precio máximo"
            >

            <br><br>

            <label for="marca">Marca:</label>

            <select id="marca">
                <option value="">Todas</option>
                <option value="Gran Marc">Gran Marc</option>
                <option value="Daedo">Daedo</option>
            </select>

            <br><br>

            <p>Categorías:</p>

            <label>
                <input
                    type="checkbox"
                    class="categoria"
                    value="Protectores"
                >
                Protectores
            </label>

            <label>
                <input
                    type="checkbox"
                    class="categoria"
                    value="Dobok"
                >
                Dobok
            </label>

            <label>
                <input
                    type="checkbox"
                    class="categoria"
                    value="Entrenamiento"
                >
                Entrenamiento
            </label>

        </div>

        <h2>Productos</h2>

        <div id="productos"></div>

    </main>

    <script src="tienda.js"></script>

</body>

</html>
