<!DOCTYPE html>
<html>
    <head>
        <title>catalogo de productos</title>
        <link rel="stylesheet" href="catalogo.css" type="text/css" rel="stylesheet"> 
    </head>
    <body class="grid-container">
        <header class="item1">
            <h1>catalogo de productos</h1>
        </header>
        <nav class="item2">
            links de navegacion
        </nav>
        <aside class="item3">
            <fieldset>
                <legend>Buscador</legend>
                <label for="buscador">Buscar</label>
                <input type="text" name="buscador" id="buscador" placeholder="buscar producto">
                
            </fieldset>
            <fieldset>
                <legend>Precios</legend>
                <p>
                <label for="minimo">Minimo</label>
                <input type="number" name="minimo" id="minimo" placeholder="minimo">
                </p>
                <p>
                <label for="maximo">Maximo</label>
                <input type="number" name="maximo" id="maximo" placeholder="maximo">
                </p>
            </fieldset>
            <fieldset>
                <legend>tipo de productos</legend>
                <p>
                    <input type="checkbox" name="tipo" id="tipo1">
                    <label for="tipo1">Motor</label>
                    <input type="checkbox" name="tipo" id="tipo2">
                    <label for="tipo2">Suspension</label>
                    <input type="checkbox" name="tipo" id="tipo3">
                    <label for="tipo3">Interior</label>
                    <input type="checkbox" name="tipo" id="tipo4">
                    <label for="tipo4">Exterior</label>
                </p>
            </fieldset>
        </aside>
        <main>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-t8IK8Wudx5_ggGVczEVCREF5QzsE08ZI1MhiJR7RAg&s=10/cabezal-cerrado.webp" alt="cabezal cerrado">

            </div>

                <h3>kit turbo</h3>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQza-m_3i-kFvoVRswJ3K_mt3Co1mLJxdPuAEtZBZLbag&s=10/cabezal-cerrado.webp" alt="cabezal cerrado">
                <h3>Filtro de Aire</h3>
            </div>
            <div>

                <h3>k20 engine</h3>

            <div>

                <h3>Butacas Bride low max</h3>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_5xZEfPIIAnwO5wJqLQ7gTsa7nyCUt0B2EPQ8PjX4-Q&s=10/cabezal-cerrado.webp" alt="cabezal cerrado">
